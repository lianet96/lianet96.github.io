<!-- Slideshow script (a11y tweaks + hover pause) -->
<script>
(function () {
const slides = Array.from(document.querySelectorAll('.slideshow .slide'));
const dots = Array.from(document.querySelectorAll('.slideshow-dots .dot'));
if (slides.length <= 1) return;


let i = 0;
const show = (n) => {
slides[i].classList.remove('is-active');
dots[i]?.classList.remove('is-active');
i = (n + slides.length) % slides.length;
slides[i].classList.add('is-active');
dots[i]?.classList.add('is-active');
};


let timer = setInterval(() => show(i + 1), 5500);
const host = document.querySelector('.slideshow');
host.addEventListener('mouseenter', () => clearInterval(timer));
host.addEventListener('mouseleave', () => timer = setInterval(() => show(i + 1), 5500));
dots.forEach((dot, idx) => dot.addEventListener('click', () => show(idx)));


// Reduce motion preference
if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
clearInterval(timer);
}


// Year in footer
document.getElementById('year').textContent = new Date().getFullYear();
}());
</script>
